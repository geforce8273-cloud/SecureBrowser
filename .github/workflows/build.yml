name: SecureBrowse Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ZIP-Dateien entpacken
        run: |
          rm -rf extracted
          find . -type f -name "*.zip" -not -path "./.git/*" -not -path "./extracted/*" | while read -r ZIP; do
            echo "Entpacke: $ZIP"
            unzip -q -o "$ZIP" -d extracted
          done

      - name: Android Projekt finden
        run: |
          PROJECT=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" -not -path "*/llama.cpp/*" -not -path "*/third_party/*" \
            | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)

          if [ -z "$PROJECT" ]; then
            echo "Kein Android Gradle Projekt gefunden!"
            find . -maxdepth 5 -type f -not -path "./.git/*" | head -100
            exit 1
          fi

          DIR=$(realpath "$(dirname "$PROJECT")")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Projekt gefunden: $DIR"

      - name: Gradle 9.1.0 installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: NDK und CMake installieren
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Debug APK bauen
        run: |
          cd "$PROJECT_DIR"
          LOG="$GITHUB_WORKSPACE/build.log"
          set +e
          gradle :app:assembleDebug --stacktrace 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ] && grep -qE "Execution failed for task ':app:[A-Za-z]*(CMake|Ndk|ExternalNativeBuild)" "$LOG"; then
            echo "=== Native Bibliothek fehlgeschlagen: Wiederholung ohne llama.cpp ==="
            gradle -Psecurebrowse.disableNative=true :app:assembleDebug --stacktrace 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
          fi
          exit $STATUS

      - name: Unit Tests
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          gradle -Psecurebrowse.disableNative=true :app:testDebugUnitTest --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Release APK bauen
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          gradle -Psecurebrowse.disableNative=true :app:assembleRelease --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Fehler kompakt anzeigen
        if: failure()
        run: |
          echo "===== FEHLER ====="
          grep -nE "^e: |What went wrong|Could not (find|resolve)|FAILURE:|error:" -A4 "$GITHUB_WORKSPACE/build.log" | head -150 || true

      - name: APKs und Logs hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SecureBrowse-APKs
          path: |
            build.log
            **/build/outputs/apk/**/*.apk
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14
