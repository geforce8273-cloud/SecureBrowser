name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP entpacken
        run: unzip -q Sbs.zip
      - name: compileSdk auf 36 setzen
        run: sed -i 's/compileSdk = 37/compileSdk = 36/' SB/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
          cache-disabled: true
      - name: Build debug APK
        working-directory: SB
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SecureBrowse-debug-apk
          path: SB/app/build/outputs/apk/debug/*.apk
