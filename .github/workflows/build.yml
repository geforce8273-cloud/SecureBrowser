name: SecureBrowse Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ZIP-Dateien entpacken
        run: |
          find . -type f -name "*.zip" \
            -not -path "./.git/*" | while read ZIP; do
              unzip -o "$ZIP" -d extracted
          done

      - name: Android Projekt finden
        run: |
          PROJECT=$(find . -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "Kein Android Gradle Projekt gefunden!"
            find . -maxdepth 5 -type f
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          DIR=$(realpath "$DIR")

          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Projekt gefunden: $DIR"

      - name: Gradle 9.1.0 installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Android SDK prüfen
        run: |
          echo "SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Icons-Abhängigkeit korrigieren
        run: |
          python3 - <<'PY'
          import os

          project = os.environ.get("PROJECT_DIR")
          if not project:
              print("PROJECT_DIR fehlt")
              exit(1)

          extensions = (".gradle", ".gradle.kts", ".toml")

          for root, dirs, files in os.walk(project):
              dirs[:] = [d for d in dirs if d not in
                         ("build", ".gradle")]

              for name in files:
                  if not name.endswith(extensions):
                      continue

                  path = os.path.join(root, name)

                  try:
                      with open(path, "r", encoding="utf-8") as f:
                          content = f.read()
                  except Exception:
                      continue

                  updated = content.replace("1.9.4", "1.7.8")

                  if updated != content:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(updated)
                      print("Version geändert:", path)

          print("Suche nach Icons-Abhängigkeit:")
          for root, dirs, files in os.walk(project):
              dirs[:] = [d for d in dirs if d not in
                         ("build", ".gradle")]

              for name in files:
                  if name.endswith(extensions):
                      path = os.path.join(root, name)
                      try:
                          with open(path, encoding="utf-8") as f:
                              for line in f:
                                  if "material-icons-extended" in line:
                                      print(path, ":", line.strip())
                      except Exception:
                          pass
          PY

      - name: Debug APK bauen
        run: |
          cd "$PROJECT_DIR"
          gradle --refresh-dependencies assembleDebug --stacktrace

      - name: Unit Tests
        run: |
          cd "$PROJECT_DIR"
          gradle --refresh-dependencies test

      - name: Release APK bauen
        run: |
          cd "$PROJECT_DIR"
          gradle --refresh-dependencies assembleRelease

      - name: APKs hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SecureBrowse-APKs
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
