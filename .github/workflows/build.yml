name: SecureBrowse Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ZIP-Dateien entpacken
        run: |
          find . -type f -name "*.zip" \
            -not -path "./.git/*" | while read ZIP; do
              unzip -o "$ZIP" -d extracted
          done

      - name: Android Projekt finden
        run: |
          PROJECT=$(find . -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "Kein Android Gradle Projekt gefunden!"
            find . -maxdepth 5 -type f
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          DIR=$(realpath "$DIR")

          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Projekt gefunden: $DIR"

      - name: Gradle 9.1.0 installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Debug APK bauen
        id: debug
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          set -o pipefail
          gradle assembleDebug --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/debug.log" \
            | grep -E \
            "^(e: |w: |ERROR:|FAILURE:|BUILD FAILED|> Task .*FAILED|Caused by:)" \
            || true

          if grep -q "BUILD SUCCESSFUL" debug.log; then
            exit 0
          fi

          if grep -q "BUILD FAILED" debug.log; then
            exit 1
          fi

          if [ ! -f app/build/outputs/apk/debug/*.apk ]; then
            exit 1
          fi

      - name: Kotlin Fehler kompakt anzeigen
        if: steps.debug.outcome == 'failure'
        run: |
          echo "===== KOMPILIERFEHLER ====="
          grep -n -E \
            "^(e: |.*\.kt:[0-9]+:|.*\.java:[0-9]+:|Caused by:|FAILURE:|BUILD FAILED)" \
            debug.log | head -n 80 || true

          echo "===== LETZTE FEHLERZEILEN ====="
          tail -n 40 debug.log

      - name: Unit Tests
        if: steps.debug.outcome == 'success'
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          gradle test --stacktrace \
            > "$GITHUB_WORKSPACE/tests.log" 2>&1

      - name: Release APK bauen
        if: steps.debug.outcome == 'success'
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --stacktrace \
            > "$GITHUB_WORKSPACE/release.log" 2>&1

      - name: Build Logs speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SecureBrowse-Build-Logs
          path: |
            debug.log
            tests.log
            release.log
          if-no-files-found: ignore

      - name: APKs hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SecureBrowse-APKs
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Build Status
        if: steps.debug.outcome == 'failure'
        run: |
          echo "Debug-Build fehlgeschlagen."
          echo "Kompakte Fehlermeldungen wurden oben ausgegeben."
          exit 1
