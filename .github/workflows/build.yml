name: SecureBrowse Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK verwenden
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Projektpfad festlegen
        run: |
          cd salvage/SecureBrowse-v19
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - name: Debug APK bauen
        working-directory: salvage/SecureBrowse-v19
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Unit Tests
        working-directory: salvage/SecureBrowse-v19
        run: ./gradlew test

      - name: Release APK bauen
        working-directory: salvage/SecureBrowse-v19
        run: ./gradlew assembleRelease

      - name: APKs hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SecureBrowse-APKs
          path: |
            salvage/SecureBrowse-v19/app/build/outputs/apk/debug/*.apk
            salvage/SecureBrowse-v19/app/build/outputs/apk/release/*.apk
