name: SecureBrowse Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK verwenden
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"

      - name: Projekt automatisch finden
        run: |
          GRADLEW=$(find . -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew wurde nicht gefunden!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Projekt gefunden: $PROJECT_DIR"

      - name: Gradle ausführbar machen
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Debug APK bauen
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Unit Tests
        run: |
          cd "$PROJECT_DIR"
          ./gradlew test

      - name: Release APK bauen
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleRelease

      - name: APKs hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SecureBrowse-APKs
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
