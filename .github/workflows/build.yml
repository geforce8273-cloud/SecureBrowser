name: SecureBrowse Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ZIP-Dateien entpacken
        run: |
          rm -rf extracted
          find . -type f -name "*.zip" -not -path "./.git/*" -not -path "./extracted/*" | while read -r ZIP; do
            echo "Entpacke: $ZIP"
            unzip -q -o "$ZIP" -d extracted
          done

      - name: Android Projekt finden
        run: |
          PROJECT=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" -not -path "*/llama.cpp/*" -not -path "*/third_party/*" \
            | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)

          if [ -z "$PROJECT" ]; then
            echo "Kein Android Gradle Projekt gefunden!"
            find . -maxdepth 5 -type f -not -path "./.git/*" | head -100
            exit 1
          fi

          DIR=$(realpath "$(dirname "$PROJECT")")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Projekt gefunden: $DIR"

      - name: Bekannte Projektfehler reparieren
        run: |
          python3 - <<'PY'
          import os, re
          root = os.environ["PROJECT_DIR"]
          BS = chr(92)

          def rw(path, fn):
              s = open(path, encoding="utf-8").read()
              t = fn(s)
              if t != s:
                  open(path, "w", encoding="utf-8").write(t)
                  print("repariert:", path)

          def find(name):
              for dp, dirs, files in os.walk(root):
                  dirs[:] = [d for d in dirs if d not in ("build", ".gradle", "llama.cpp")]
                  if name in files:
                      return os.path.join(dp, name)

          # 1) Icons-Version
          toml = os.path.join(root, "gradle", "libs.versions.toml")
          if os.path.exists(toml):
              def f(s):
                  out = []
                  for line in s.splitlines():
                      if "material-icons-extended" in line:
                          line = re.sub(r'version\.ref\s*=\s*"[^"]*"|version\s*=\s*"[^"]*"', 'version = "1.7.8"', line)
                      out.append(line)
                  return "\n".join(out) + "\n"
              rw(toml, f)

          # 2) PromptSafety: doppelter Backslash in Zeichenliteralen
          p = find("PromptSafety.kt")
          if p:
              rw(p, lambda s: s.replace("'" + BS * 2 + "u", "'" + BS + "u"))

          # 3) BrowserStore: encodeHistory muss String liefern
          p = find("BrowserStore.kt")
          if p:
              def f(s):
                  i = s.find("fun encodeHistory")
                  if i < 0:
                      return s
                  j = s.find("\n    }", i)
                  if j < 0 or s[j + 6:j + 17] == ".toString()":
                      return s
                  return s[:j + 6] + ".toString()" + s[j + 6:]
              rw(p, f)

          # 4) LlamaInferenceEngine: trimIndent() ist keine Konstante
          p = find("LlamaInferenceEngine.kt")
          if p:
              rw(p, lambda s: s.replace("const val DEFAULT_SYSTEM_PROMPT", "val DEFAULT_SYSTEM_PROMPT"))

          # 5) JarvisCallScreen: Launcher muss nach startRecognition() stehen
          p = find("JarvisCallScreen.kt")
          if p:
              def f(s):
                  a = s.find("    val permission = rememberLauncherForActivityResult")
                  b = s.find("    fun startRecognition()")
                  if a < 0 or b < 0 or a > b:
                      return s
                  e = s.find("\n    }\n", a) + 7
                  block = s[a:e]
                  s = s[:a] + s[e:].lstrip("\n")
                  k = s.find("    Scaffold(containerColor")
                  if k < 0:
                      return s[:a] + block + "\n" + s[a:]
                  return s[:k] + block + "\n" + s[k:]
              rw(p, f)
          PY

      - name: Gradle 9.1.0 installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: NDK und CMake installieren
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "cmake;3.22.1" || echo "Installation fehlgeschlagen - Gradle versucht es selbst"

      - name: Debug APK bauen
        run: |
          cd "$PROJECT_DIR"
          LOG="$GITHUB_WORKSPACE/build.log"
          set +e
          gradle :app:assembleDebug --stacktrace 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ] && grep -qE "Execution failed for task ':app:[A-Za-z]*(CMake|Ndk|ExternalNativeBuild)" "$LOG"; then
            echo "=== Native Bibliothek fehlgeschlagen: Wiederholung ohne llama.cpp ==="
            gradle -Psecurebrowse.disableNative=true :app:assembleDebug --stacktrace 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
          fi
          exit $STATUS

      - name: Unit Tests
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          gradle -Psecurebrowse.disableNative=true :app:testDebugUnitTest --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Release APK bauen
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          gradle -Psecurebrowse.disableNative=true :app:assembleRelease --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Fehler kompakt anzeigen
        if: failure()
        run: |
          echo "===== KOTLIN-FEHLER ====="
          grep -nE "^e: " "$GITHUB_WORKSPACE/build.log" | sort -u -t: -k3 | head -60 || true
          echo "===== CMAKE-FEHLER ====="
          grep -nE "CMake Error|error:|fatal error" -A3 "$GITHUB_WORKSPACE/build.log" | head -60 || true
          echo "===== GRADLE ====="
          grep -nE "What went wrong|Could not (find|resolve)" -A3 "$GITHUB_WORKSPACE/build.log" | head -60 || true

      - name: APKs und Logs hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SecureBrowse-APKs
          path: |
            build.log
            **/build/outputs/apk/**/*.apk
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14
